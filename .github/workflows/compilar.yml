name: Compilar Java

on:
  push:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v5

      - name: Preparar Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Compilar el proyecto
        run: |
          mkdir -p build
          find src/main/java -name "*.java" > fuentes.txt
          javac --release 11 -encoding UTF-8 -d build @fuentes.txt

      - name: Compilar la prueba de licencia
        run: |
          javac --release 11 -encoding UTF-8 -cp build -d build src/test/java/PruebaLicencia.java

      - name: Probar edicion y persistencia de licencia
        run: |
          carpeta_prueba=$(mktemp -d)
          cd "$carpeta_prueba"
          java -cp "$GITHUB_WORKSPACE/build" PruebaLicencia

      - name: Compilar la prueba de edad
        run: |
          javac --release 11 -encoding UTF-8 -cp build -d build src/test/java/PruebaEdad.java

      - name: Probar validacion de edad
        run: |
          java -cp build PruebaEdad
      
      - name: Compilar la prueba de conflictos
        run: |
          javac --release 11 -encoding UTF-8 -cp build -d build src/test/java/PruebaConflictos.java

      - name: Probar conflictos de turnos
        run: |
          java -cp build PruebaConflictos